# =============================================================================
# 413 Request Entity Too Large - nginx (Ubuntu)
# =============================================================================
#
# Soubor v projektu nginx NEČTE. Musíš přidat řádek níže do konfigurace NA SERVERU
# (SSH / hosting panel), pak:  sudo nginx -t && sudo systemctl reload nginx
#
# RYCHLÁ DIAGNOSTIKA NA SERVERU (zkopíruj do SSH):
#
#   sudo nginx -T 2>/dev/null | grep -i client_max_body
#
# Pokud nic nenajdeš, platí výchozí 1 MB → 413 na větší upload je očekávané.
#
# KDE TO NASTAVIT (stačí jedno z toho, nejlépe u serveru pro tvou doménu):
#
# A) Globálně pro celý nginx (http { } v /etc/nginx/nginx.conf):
#
#     http {
#         client_max_body_size 1G;
#         ...
#     }
#
# B) Jen pro jeden web (server { } v sites-available/...):
#
#     server {
#         listen 443 ssl;
#         server_name tvoje-domena.cz;
#         client_max_body_size 1G;
#         location / {
#             proxy_pass http://127.0.0.1:PORT;
#             ...
#         }
#     }
#
# C) Pterodactyl Wings - nginx generuje panel. Zvýš:
#    Administrace panelu → Nodes → tvůj uzel → „Upload size“ / max. velikost uploadu (MB).
#    Po změně Wings znovu zapíše konfiguraci (restart služby / rebuild podle dokumentace).
#    Pokud máš JEŠTĚ nginx před serverem (např. Cloud VPS), nastav client_max_body_size i TAM.
#
# DVĚ VRSTVY: často běží nginx na VPS + další u poskytovatele. 413 vrací TEN, který
# požadavek přijme jako první - musíš opravit oba, nebo ten správný podle traceroute/DNS.
#
# --- Máš už 2000M v „nginx -T | grep client_max“ a přesto 413? ---
#   • grep ukáže jen ČÁST konfigurace - může existovat DRUHÝ server { } bez limitu,
#     který obslouží tvou doménu (default_server, chybný server_name, IPv6 jiný blok).
#   • Spusť v projektu:  bash deploy/diagnose-nginx-413.sh - vypíše kontext u každého limitu.
#   • Ověř: dig +short tvoje-domena.cz  musí být IP toho VPS, kde jsi upravoval nginx.
#   • Pterodactyl: upload často jde přes proxy WINGS - zvýš „Upload size“ na uzlu v panelu;
#     vnější nginx na VPS + vnitřní generovaný config jsou DVĚ různá místa.
#   • Jistota pro jeden web: dej client_max_body_size 2000M; hned za řádek server_name
#     pro 11ka.cz www.11ka.cz A stejný řádek i do location / { ... } před proxy_pass.
#
# =============================================================================

client_max_body_size 1G;
